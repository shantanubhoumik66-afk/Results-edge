name: Update results
on:
  schedule:
    - cron: "30 2,6,10,14 * * 1-6"   # several times a day (UTC)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas requests
      - run: python fetch_results.py
      - run: |
          git config user.name "results-bot"
          git config user.email "bot@users.noreply.github.com"
          git add results.json
          git diff --cached --quiet || (git commit -m "Update results" && git push)
          
